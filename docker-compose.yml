services:
  postgres:
    image: postgres:16-alpine
    container_name: sumitsugi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sumitsugi
      POSTGRES_PASSWORD: sumitsugi
      POSTGRES_DB: sumitsugi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumitsugi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
