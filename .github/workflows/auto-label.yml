name: Auto Label PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-label PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = new Set(pr.labels.map(l => l.name));
            const newLabels = [];

            // --- Label by PR title convention ---
            const title = pr.title.toLowerCase();
            const typeMap = {
              'feat': 'feature',
              'fix': 'bugfix',
              'docs': 'documentation',
              'refactor': 'refactor',
              'test': 'testing',
              'chore': 'chore',
              'perf': 'performance',
              'ci': 'ci',
            };
            for (const [prefix, label] of Object.entries(typeMap)) {
              if (title.startsWith(`${prefix}:`) || title.startsWith(`${prefix}(`)) {
                if (!labels.has(label)) newLabels.push(label);
              }
            }

            // --- Label by changed files ---
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const paths = files.map(f => f.filename);

            const pathLabels = {
              'e2e:run': (p) => p.some(f => f.startsWith('src/') && !f.endsWith('.test.ts') && !f.endsWith('.test.tsx')),
              'auth': (p) => p.some(f => f.includes('/auth') || f.includes('auth-context')),
              'payments': (p) => p.some(f => f.includes('/stripe/') || f.includes('/payment/')),
              'ui': (p) => p.some(f => f.startsWith('src/components/') && !f.includes('__tests__')),
              'api': (p) => p.some(f => f.includes('/api/') || f.includes('route.ts')),
              'ci': (p) => p.some(f => f.startsWith('.github/')),
              'documentation': (p) => p.some(f => f.endsWith('.md') && !f.startsWith('src/')),
            };

            for (const [label, check] of Object.entries(pathLabels)) {
              if (check(paths) && !labels.has(label)) {
                newLabels.push(label);
              }
            }

            // --- Label by size ---
            const totalChanges = files.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const sizeLabel = totalChanges <= 50 ? 'size:S' :
                              totalChanges <= 200 ? 'size:M' :
                              totalChanges <= 500 ? 'size:L' : 'size:XL';
            if (!labels.has(sizeLabel)) newLabels.push(sizeLabel);

            // --- Apply labels ---
            if (newLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: newLabels,
              });
              console.log(`Added labels: ${newLabels.join(', ')}`);
            } else {
              console.log('No new labels to add');
            }
