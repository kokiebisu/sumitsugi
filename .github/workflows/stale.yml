name: Stale Issues & PRs

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          # Issues
          stale-issue-message: >
            This issue has been inactive for 30 days and will be closed in 7 days
            unless there is new activity. Add the `keep-open` label to prevent auto-close.
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          exempt-issue-labels: 'keep-open,needs-human,autonomous-failure,health-report'

          # PRs
          stale-pr-message: >
            This PR has been inactive for 14 days and will be closed in 7 days
            unless there is new activity.
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          exempt-pr-labels: 'keep-open,no-auto-merge'

          # Limits
          operations-per-run: 30
