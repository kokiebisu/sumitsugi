name: Daily Standup

on:
  schedule:
    # 09:00 JST = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  standup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Collect metrics
        id: metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)

          # PRs merged yesterday
          gh pr list --state merged --search "merged:>=$YESTERDAY" --json number,title,mergedAt --limit 20 > /tmp/prs_merged.json 2>/dev/null || echo "[]" > /tmp/prs_merged.json

          # PRs currently open
          gh pr list --state open --json number,title,author --limit 20 > /tmp/prs_open.json 2>/dev/null || echo "[]" > /tmp/prs_open.json

          # Task stats from beads
          TASKS_DONE=$(cat .beads/issues.jsonl | jq -s '[.[] | select(.status == "done")] | length' 2>/dev/null || echo "0")
          TASKS_OPEN=$(cat .beads/issues.jsonl | jq -s '[.[] | select(.status == "open")] | length' 2>/dev/null || echo "0")
          TASKS_BLOCKED=$(cat .beads/issues.jsonl | jq -s '[.[] | select(.status == "blocked")] | length' 2>/dev/null || echo "0")

          # Stale task detection: open tasks not updated in 7+ days
          STALE_TASKS=$(cat .beads/issues.jsonl | jq -s --arg cutoff "$(date -u -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-7d +%Y-%m-%d)" \
            '[.[] | select(.status == "open" and (.updated_at // .created_at) < $cutoff)] | length' 2>/dev/null || echo "0")
          echo "tasks_stale=$STALE_TASKS" >> "$GITHUB_OUTPUT"

          # Recent commits
          git log --since="$YESTERDAY" --oneline --no-merges 2>/dev/null | head -20 > /tmp/commits.txt

          # Failed workflow runs
          gh run list --created ">=$YESTERDAY" --status failure --limit 10 --json name,conclusion,createdAt > /tmp/failed_runs.json 2>/dev/null || echo "[]" > /tmp/failed_runs.json

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "tasks_done=$TASKS_DONE" >> "$GITHUB_OUTPUT"
          echo "tasks_open=$TASKS_OPEN" >> "$GITHUB_OUTPUT"
          echo "tasks_blocked=$TASKS_BLOCKED" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate standup report
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPORT_DATE: ${{ steps.metrics.outputs.today }}
          TASKS_DONE: ${{ steps.metrics.outputs.tasks_done }}
          TASKS_OPEN: ${{ steps.metrics.outputs.tasks_open }}
          TASKS_BLOCKED: ${{ steps.metrics.outputs.tasks_blocked }}
          TASKS_STALE: ${{ steps.metrics.outputs.tasks_stale }}
        run: |
          PRS_MERGED=$(cat /tmp/prs_merged.json)
          PRS_OPEN=$(cat /tmp/prs_open.json)
          COMMITS=$(cat /tmp/commits.txt)
          FAILED_RUNS=$(cat /tmp/failed_runs.json)

          PROMPT="Generate a concise daily standup report in Japanese for date $REPORT_DATE.

          Format:
          # デイリースタンドアップ $REPORT_DATE

          ## 昨日の成果
          (list PRs merged and tasks completed)

          ## 本日の予定
          (pick top 3 priorities from open tasks)

          ## ブロッカー
          (list blocked items and failed runs)

          ## 棚卸しアラート
          (if stale tasks > 0, warn that some open tasks have not been updated in 7+ days and may be already completed but not closed. Recommend running task audit.)

          ## メトリクス
          | 指標 | 値 |
          |------|-----|
          | 完了タスク | $TASKS_DONE |
          | 残タスク | $TASKS_OPEN |
          | ブロック中 | $TASKS_BLOCKED |
          | 7日以上未更新 | $TASKS_STALE |

          Data:
          PRs Merged: $PRS_MERGED
          PRs Open: $PRS_OPEN
          Recent Commits: $COMMITS
          Failed Runs: $FAILED_RUNS"

          REPORT=$(echo "$PROMPT" | claude -p --model claude-sonnet-4-5-20250929 2>/dev/null || echo "Report generation failed")

          mkdir -p docs/team/standups
          echo "$REPORT" > "docs/team/standups/$REPORT_DATE.md"
          echo "$REPORT" > /tmp/standup_report.md

      - name: Update DASHBOARD.md
        env:
          REPORT_DATE: ${{ steps.metrics.outputs.today }}
          TASKS_DONE: ${{ steps.metrics.outputs.tasks_done }}
          TASKS_OPEN: ${{ steps.metrics.outputs.tasks_open }}
          TASKS_BLOCKED: ${{ steps.metrics.outputs.tasks_blocked }}
        run: |
          if [ ! -f DASHBOARD.md ]; then exit 0; fi

          # Update "Last updated" line
          sed -i "s/^> Last updated:.*/> Last updated: $REPORT_DATE/" DASHBOARD.md

          # Update autonomous state if available
          if [ -f .github/autonomous/state.json ]; then
            LIFETIME_TASKS=$(jq '.lifetime.total_tasks_completed' .github/autonomous/state.json 2>/dev/null || echo "0")
            LIFETIME_PRS=$(jq '.lifetime.total_prs_merged' .github/autonomous/state.json 2>/dev/null || echo "0")
            STREAK=$(jq '.streak.current' .github/autonomous/state.json 2>/dev/null || echo "0")

            # Append or update Linear Sync Status section
            if grep -q "^## Linear Sync Status" DASHBOARD.md; then
              sed -i "/^## Linear Sync Status/,/^---/{
                s/^\*\*Last synced:\*\*.*/\*\*Last synced:\*\* $REPORT_DATE/
                s/^- Done:.*/- Done: $TASKS_DONE tasks/
              }" DASHBOARD.md
            fi
          fi

      - name: Commit report via PR
        env:
          REPORT_DATE: ${{ steps.metrics.outputs.today }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/team/standups/ DASHBOARD.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Use a branch + PR instead of direct push to main.
          # This prevents unnecessary smoke test triggers and respects the merge gate.
          BRANCH="docs/standup-$REPORT_DATE"
          git checkout -b "$BRANCH"
          git commit -m "docs: daily standup $REPORT_DATE"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "docs: daily standup $REPORT_DATE" \
            --body "Automated daily standup report. Docs-only changes." \
            --base main \
            --head "$BRANCH"

          git checkout main
          git pull origin main

      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_DATE: ${{ steps.metrics.outputs.today }}
        run: |
          REPORT=$(cat /tmp/standup_report.md)
          gh issue create \
            --title "Daily Standup: $REPORT_DATE" \
            --body "$REPORT" \
            --label "standup"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TASKS_DONE: ${{ steps.metrics.outputs.tasks_done }}
          TASKS_OPEN: ${{ steps.metrics.outputs.tasks_open }}
          TASKS_BLOCKED: ${{ steps.metrics.outputs.tasks_blocked }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          MSG=":sunrise: *Daily Standup*\nDone: $TASKS_DONE | Open: $TASKS_OPEN | Blocked: $TASKS_BLOCKED\nFull report posted as GitHub Issue"
          bash scripts/notify-slack.sh "$MSG"

      - name: Summary
        if: always()
        run: |
          echo "## Daily Standup" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/standup_report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report generated" >> "$GITHUB_STEP_SUMMARY"
