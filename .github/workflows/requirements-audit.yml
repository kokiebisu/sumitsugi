name: Requirements Audit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_DATE: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set date
        run: echo "AUDIT_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Collect context
        run: |
          echo "Collecting requirements and code..."

          # Requirements files
          cat .claude/REQUIREMENTS.md > /tmp/requirements.md 2>/dev/null || echo "No REQUIREMENTS.md" > /tmp/requirements.md
          cat .claude/BUSINESS.md > /tmp/business.md 2>/dev/null || echo "No BUSINESS.md" > /tmp/business.md

          # Code structure
          find src -name "*.ts" -o -name "*.tsx" 2>/dev/null | head -30 | xargs -I {} sh -c 'echo "=== {} ===" && head -20 {}' > /tmp/code.txt 2>/dev/null || echo "No src" > /tmp/code.txt

          # Existing tasks
          cat .beads/issues.jsonl 2>/dev/null | jq -s '[.[] | {id, title, status}]' > /tmp/tasks.json 2>/dev/null || echo "[]" > /tmp/tasks.json

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Audit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          REQUIREMENTS=$(cat /tmp/requirements.md)
          BUSINESS=$(cat /tmp/business.md)
          CODE=$(cat /tmp/code.txt)
          TASKS=$(cat /tmp/tasks.json)

          PROMPT="Audit this codebase against requirements. Find gaps between REQUIREMENTS.md and actual code.

          Output JSON only:
          {\"summary\": \"...\", \"gaps\": [{\"title\": \"...\", \"description\": \"...\", \"priority\": 1, \"source\": \"...\"}], \"no_gaps_found\": false}

          REQUIREMENTS.md:
          $REQUIREMENTS

          BUSINESS.md:
          $BUSINESS

          Code:
          $CODE

          Existing tasks (avoid duplicates):
          $TASKS"

          RESPONSE=$(echo "$PROMPT" | claude -p --model claude-sonnet-4-5-20250929 2>/dev/null || echo '{"error": "failed"}')
          echo "$RESPONSE" > /tmp/audit.json
          cat /tmp/audit.json

      - name: Create tasks and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUDIT=$(cat /tmp/audit.json)

          if ! echo "$AUDIT" | jq empty 2>/dev/null; then
            echo "Invalid JSON, skipping"
            exit 0
          fi

          SUMMARY=$(echo "$AUDIT" | jq -r '.summary // "Audit done"')
          GAP_COUNT=$(echo "$AUDIT" | jq -r '.gaps | length // 0')

          # Skip if no gaps found
          if [ "$GAP_COUNT" = "0" ] || [ "$GAP_COUNT" = "null" ]; then
            echo "No gaps found, skipping PR creation"
            exit 0
          fi

          # Add tasks to beads
          echo "$AUDIT" | jq -c '.gaps[]?' | while read -r gap; do
            TITLE=$(echo "$gap" | jq -r '.title')
            DESC=$(echo "$gap" | jq -r '.description')
            PRIORITY=$(echo "$gap" | jq -r '.priority // 2')
            NEW_ID="sumitsugi-$(openssl rand -hex 3)"
            TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "{\"id\":\"$NEW_ID\",\"title\":\"$TITLE\",\"description\":\"$DESC\",\"status\":\"open\",\"priority\":$PRIORITY,\"issue_type\":\"task\",\"created_at\":\"$TS\",\"created_by\":\"Audit\",\"labels\":[\"audit\"]}" >> .beads/issues.jsonl
          done

          # Git config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch
          BRANCH="audit/$AUDIT_DATE"
          git checkout -b "$BRANCH"

          # Commit beads
          git add .beads/issues.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(audit): add tasks"

          # Create report
          mkdir -p .github/audits
          echo "# Audit $AUDIT_DATE" > ".github/audits/$AUDIT_DATE.md"
          echo "" >> ".github/audits/$AUDIT_DATE.md"
          echo "## Summary" >> ".github/audits/$AUDIT_DATE.md"
          echo "$SUMMARY" >> ".github/audits/$AUDIT_DATE.md"
          echo "" >> ".github/audits/$AUDIT_DATE.md"
          echo "## Gaps: $GAP_COUNT" >> ".github/audits/$AUDIT_DATE.md"
          echo "$AUDIT" | jq -r '.gaps[]? | "- \(.title)"' >> ".github/audits/$AUDIT_DATE.md"

          git add ".github/audits/$AUDIT_DATE.md"
          git commit -m "docs(audit): report $AUDIT_DATE" || true

          # Push and PR (force to handle re-runs on same day)
          git push -u origin "$BRANCH" --force

          gh pr create \
            --title "chore(audit): $AUDIT_DATE daily audit" \
            --body "## Summary
          $SUMMARY

          **Gaps Found:** $GAP_COUNT

          This PR was created by the daily requirements audit.
          It will be reviewed and merged by the autonomous-pr-review workflow." \
            --base main \
            --head "$BRANCH"

          # NOTE: Do NOT auto-merge here. Let autonomous-pr-review handle the merge
          # after CI passes and main health is verified. This prevents bypassing
          # the merge gate and potentially breaking main.
