name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          else
            FILES=$(git diff --name-only HEAD~1 2>/dev/null || echo "force-run")
          fi

          CODE_CHANGED=false
          while IFS= read -r file; do
            case "$file" in
              .beads/*|.github/autonomous/*) ;;
              *) CODE_CHANGED=true; break ;;
            esac
          done <<< "$FILES"

          echo "code_changed=$CODE_CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CODE_CHANGED" = "false" ]; then
            echo "Skipping CI: only data files changed"
          fi
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Setup Bun
        if: steps.changes.outputs.code_changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.changes.outputs.code_changed == 'true'
        run: bun install --frozen-lockfile

      - name: Run ESLint
        if: steps.changes.outputs.code_changed == 'true'
        run: bunx eslint . --max-warnings 200

      - name: Check formatting (non-blocking)
        if: steps.changes.outputs.code_changed == 'true'
        run: bunx prettier --check . || true

      - name: TypeScript build check
        if: steps.changes.outputs.code_changed == 'true'
        run: bun run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Run unit tests with coverage
        if: steps.changes.outputs.code_changed == 'true'
        run: bun run test:run --coverage

      - name: Report bundle size
        if: github.event_name == 'pull_request' && steps.changes.outputs.code_changed == 'true'
        run: |
          # Measure .next output size
          if [ -d ".next" ]; then
            TOTAL_SIZE=$(du -sb .next | cut -f1)
            TOTAL_MB=$(echo "scale=2; $TOTAL_SIZE / 1048576" | bc)

            # Measure key chunks
            JS_SIZE=0
            if [ -d ".next/static/chunks" ]; then
              JS_SIZE=$(du -sb .next/static/chunks | cut -f1)
            fi
            JS_MB=$(echo "scale=2; $JS_SIZE / 1048576" | bc)

            echo "## Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Size |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total build output | ${TOTAL_MB} MB |" >> "$GITHUB_STEP_SUMMARY"
            echo "| JS chunks | ${JS_MB} MB |" >> "$GITHUB_STEP_SUMMARY"

            # Warn if bundle is too large (>5MB JS)
            JS_SIZE_INT=${JS_SIZE%.*}
            if [ "${JS_SIZE_INT:-0}" -gt 5242880 ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "⚠️ **JS bundle exceeds 5MB budget**" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
