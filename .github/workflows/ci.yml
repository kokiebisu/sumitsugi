name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bunx eslint . --max-warnings 200

      - name: Check formatting (non-blocking)
        run: bunx prettier --check . || true

      - name: TypeScript build check
        run: bun run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Run unit tests
        run: bun run test:run

      - name: Report bundle size
        if: github.event_name == 'pull_request'
        run: |
          # Measure .next output size
          if [ -d ".next" ]; then
            TOTAL_SIZE=$(du -sb .next | cut -f1)
            TOTAL_MB=$(echo "scale=2; $TOTAL_SIZE / 1048576" | bc)

            # Measure key chunks
            JS_SIZE=0
            if [ -d ".next/static/chunks" ]; then
              JS_SIZE=$(du -sb .next/static/chunks | cut -f1)
            fi
            JS_MB=$(echo "scale=2; $JS_SIZE / 1048576" | bc)

            echo "## Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Size |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total build output | ${TOTAL_MB} MB |" >> "$GITHUB_STEP_SUMMARY"
            echo "| JS chunks | ${JS_MB} MB |" >> "$GITHUB_STEP_SUMMARY"

            # Warn if bundle is too large (>5MB JS)
            JS_SIZE_INT=${JS_SIZE%.*}
            if [ "${JS_SIZE_INT:-0}" -gt 5242880 ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "⚠️ **JS bundle exceeds 5MB budget**" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
