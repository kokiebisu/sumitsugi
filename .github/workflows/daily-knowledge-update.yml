name: Daily Knowledge Update

on:
  schedule:
    # 毎日午前9時(JST) = 午前0時(UTC)に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  update-knowledge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install dependencies
        run: bun install

      - name: Run daily knowledge update script
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: bun run scripts/daily-knowledge-update.ts

      - name: Commit and push changes
        run: |
          TODAY=$(date +'%Y-%m-%d')
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/team/*/knowledge/
          git diff --staged --quiet || git commit -m "chore: daily knowledge update $TODAY"

          # Pull latest changes and rebase before pushing (handles concurrent updates)
          git pull --rebase origin main
          git push
