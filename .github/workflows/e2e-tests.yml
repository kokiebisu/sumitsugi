name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  determine-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      test-filter: ${{ steps.set-filter.outputs.filter }}
      detected-tags: ${{ steps.set-filter.outputs.tags }}
      skip-tests: ${{ steps.check-labels.outputs.skip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR labels
        id: check-labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);

            if (labels.includes('e2e:skip')) {
              core.setOutput('skip', 'true');
              return;
            }

            if (labels.includes('e2e:full-suite')) {
              core.setOutput('full-suite', 'true');
              return;
            }

            if (labels.includes('e2e:critical-only')) {
              core.setOutput('critical-only', 'true');
              return;
            }

            core.setOutput('skip', 'false');

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect tags with fallback script
        id: fallback-detection
        run: node scripts/detect-test-tags.js

      - name: Set filter output
        id: set-filter
        run: |
          if [[ "${{ steps.check-labels.outputs.skip }}" == "true" ]]; then
            echo "filter=@skip-all-tests" >> $GITHUB_OUTPUT
            echo "tags=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "${{ steps.check-labels.outputs.critical-only }}" == "true" ]]; then
            echo "filter=@critical" >> $GITHUB_OUTPUT
            echo "tags=critical" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "${{ steps.check-labels.outputs.full-suite }}" == "true" ]]; then
            echo "filter=" >> $GITHUB_OUTPUT
            echo "tags=all" >> $GITHUB_OUTPUT
            exit 0
          fi

          # No labels set - use fallback script output
          FILTER="${{ steps.fallback-detection.outputs.filter }}"
          TAGS="${{ steps.fallback-detection.outputs.tags }}"

          echo "filter=$FILTER" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Using fallback detection: filter=$FILTER, tags=$TAGS"

  e2e-tests:
    needs: [determine-tests]
    if: |
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && needs.determine-tests.outputs.skip-tests != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://user:password@localhost:5432/test_db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci-builds-only

      - name: Run E2E tests
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ needs.determine-tests.outputs.test-filter }}" == "" ]]; then
            echo "Running full test suite"
            npm run test:e2e
          else
            FILTER="${{ needs.determine-tests.outputs.test-filter }}"
            echo "Running filtered tests: $FILTER"
            npm run test:e2e -- --grep "$FILTER"
          fi
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Generate detailed test report
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          try {
            const results = JSON.parse(fs.readFileSync('playwright-results.json', 'utf8'));
            const stats = results.stats || {};

            let report = {
              passed: stats.expected || 0,
              failed: stats.unexpected || 0,
              flaky: stats.flaky || 0,
              skipped: stats.skipped || 0,
              total: (stats.expected || 0) + (stats.unexpected || 0) + (stats.flaky || 0) + (stats.skipped || 0),
              duration: (stats.duration || 0) / 1000,
              failedTests: [],
              screenshots: []
            };

            // Extract failed test details and screenshots
            results.suites?.forEach(suite => {
              suite.specs?.forEach(spec => {
                spec.tests?.forEach(test => {
                  const result = test.results?.[0];
                  if (result?.status === 'unexpected') {
                    // Get screenshot path if exists
                    const testDir = result.attachments?.find(a => a.name === 'screenshot')?.path;
                    let screenshotPath = null;

                    if (testDir) {
                      screenshotPath = testDir;
                    } else {
                      // Try to find screenshot in test-results
                      const testId = spec.id || '';
                      const screenshotGlob = \`test-results/**/test-failed-1.png\`;
                      try {
                        const { execSync } = require('child_process');
                        const found = execSync(\`find test-results -name 'test-failed-1.png' | head -1\`).toString().trim();
                        if (found) screenshotPath = found;
                      } catch (e) {}
                    }

                    report.failedTests.push({
                      title: spec.title,
                      file: spec.file,
                      error: result.error?.message || 'Unknown error',
                      screenshot: screenshotPath
                    });

                    if (screenshotPath && report.screenshots.length < 5) {
                      report.screenshots.push(screenshotPath);
                    }
                  }
                });
              });
            });

            fs.writeFileSync('test-report-summary.json', JSON.stringify(report, null, 2));
          } catch (error) {
            console.error('Error generating report:', error);
            fs.writeFileSync('test-report-summary.json', JSON.stringify({
              error: error.message,
              passed: 0,
              failed: 0,
              total: 0,
              screenshots: []
            }, null, 2));
          }
          "

      - name: Copy screenshots to report directory
        if: always()
        run: |
          mkdir -p playwright-report/screenshots
          # Find and copy screenshots from failed tests to report directory
          find test-results -name "test-failed-*.png" 2>/dev/null | head -10 | while IFS= read -r screenshot; do
            filename=$(basename "$(dirname "$screenshot")")-$(basename "$screenshot")
            cp "$screenshot" "playwright-report/screenshots/$filename" 2>/dev/null || true
          done
          ls -la playwright-report/screenshots/ || echo "No screenshots found"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Deploy Playwright Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: e2e-reports/${{ github.run_number }}
          keep_files: true

      - name: Comment PR with results and embedded screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let comment = '## 🎭 E2E Test Results\n\n';

            try {
              const report = JSON.parse(fs.readFileSync('test-report-summary.json', 'utf8'));

              if (report.error) {
                comment += `⚠️ Error generating report: ${report.error}\n\n`;
                comment += `Check the [workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n`;
              } else {
                const passRate = report.total > 0 ? Math.round((report.passed / report.total) * 100) : 0;
                const statusIcon = report.failed === 0 ? '✅' : '❌';

                comment += `${statusIcon} **Status:** ${report.failed === 0 ? 'All tests passed!' : `${report.failed} test(s) failed`}\n\n`;

                // Add test selection info for PRs
                const testFilter = '${{ needs.determine-tests.outputs.test-filter }}';
                const detectedTags = '${{ needs.determine-tests.outputs.detected-tags }}';

                if (testFilter && testFilter !== '' && testFilter !== '@skip-all-tests') {
                  comment += '### 🎯 Test Selection\n\n';
                  comment += `**Filter:** \`${testFilter}\`\n\n`;

                  const tags = testFilter.match(/@\w+/g) || [];
                  if (tags.length > 0) {
                    comment += '**Tags included:**\n';
                    tags.forEach(tag => {
                      const tagName = tag.substring(1);
                      const tagDescriptions = {
                        'critical': 'Core user journeys',
                        'smoke': 'Quick sanity checks',
                        'auth': 'Authentication flows',
                        'listing': 'Listing management',
                        'properties': 'Property browsing',
                        'extended': 'Edge case tests'
                      };
                      const description = tagDescriptions[tagName] || 'Unknown tag';
                      comment += `- \`${tag}\` - ${description}\n`;
                    });
                    comment += '\n';
                  }

                  comment += '💡 **Note:** Full suite will run when merged to main\n\n';
                }

                comment += '### 📊 Test Results\n\n';
                comment += '| Metric | Value |\n';
                comment += '|--------|-------|\n';
                comment += `| Total Tests | ${report.total} |\n`;
                comment += `| ✅ Passed | ${report.passed} (${passRate}%) |\n`;
                if (report.failed > 0) comment += `| ❌ Failed | ${report.failed} |\n`;
                if (report.flaky > 0) comment += `| ⚠️ Flaky | ${report.flaky} |\n`;
                if (report.skipped > 0) comment += `| ⏭️ Skipped | ${report.skipped} |\n`;
                comment += `| ⏱️ Duration | ${report.duration.toFixed(1)}s |\n\n`;

                // Link to GitHub Pages report
                const repoUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}`;
                const reportUrl = `${repoUrl}/e2e-reports/${context.runNumber}`;

                comment += `### 🌐 [View Full Report with Videos](${reportUrl})\n\n`;
                comment += `👆 Click above to view the interactive report with:\n`;
                comment += `- 🎥 Video playback of all failed tests\n`;
                comment += `- 🔍 Interactive trace viewer\n`;
                comment += `- 📊 Detailed timeline and metrics\n\n`;

                // Embedded screenshots from GitHub Pages
                if (report.failed > 0) {
                  comment += '### 📸 Failed Test Screenshots\n\n';

                  const screenshotDir = 'playwright-report/screenshots';
                  let screenshots = [];

                  try {
                    screenshots = fs.readdirSync(screenshotDir).filter(f => f.endsWith('.png'));
                  } catch (e) {
                    console.log('No screenshot directory found');
                  }

                  if (screenshots.length > 0) {
                    comment += '<details>\n<summary>Click to view screenshots from failed tests</summary>\n\n';

                    for (let i = 0; i < Math.min(screenshots.length, 10); i++) {
                      const screenshot = screenshots[i];
                      const screenshotUrl = `${reportUrl}/screenshots/${screenshot}`;

                      comment += `#### Screenshot ${i + 1}\n`;
                      comment += `![Failed test screenshot](${screenshotUrl})\n\n`;
                    }

                    comment += '</details>\n\n';
                  } else {
                    comment += `*Screenshots will be available in the [full report](${reportUrl})*\n\n`;
                  }

                  // Failed test details
                  comment += '<details>\n<summary>📋 Click to view failure details</summary>\n\n';

                  report.failedTests.slice(0, 10).forEach((test, idx) => {
                    comment += `#### ${idx + 1}. ${test.title}\n`;
                    comment += `📁 **File:** \`${test.file}\`\n\n`;
                    const errorLines = test.error.split('\n').slice(0, 3).join('\n');
                    comment += '```\n' + errorLines + '\n```\n\n';
                  });

                  if (report.failedTests.length > 10) {
                    comment += `*...and ${report.failedTests.length - 10} more failures*\n\n`;
                  }

                  comment += '</details>\n\n';
                }

                // Artifacts section
                comment += '### 📦 Artifacts & Recordings\n\n';
                comment += `Download the artifacts to view:\n`;
                comment += `- 🎥 **Video recordings** of all failed tests (.webm)\n`;
                comment += `- 📸 **Screenshots** captured at failure points (.png)\n`;
                comment += `- 🔍 **Trace files** for step-by-step debugging (.zip)\n`;
                comment += `- 📊 **Interactive HTML report** with embedded media\n\n`;

                comment += `**How to view:**\n`;
                comment += `1. Go to the [workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;
                comment += `2. Scroll to **Artifacts** section at the bottom\n`;
                comment += `3. Download \`playwright-artifacts\` (contains all recordings)\n`;
                comment += `4. Extract the zip file\n`;
                comment += `5. Open \`playwright-report/index.html\` in your browser\n\n`;

                comment += '<details>\n<summary>📖 Viewing trace files (interactive debugger)</summary>\n\n';
                comment += '```bash\n';
                comment += '# After extracting artifacts:\n';
                comment += 'npx playwright show-trace test-results/[test-name]/trace.zip\n';
                comment += '```\n\n';
                comment += 'The trace viewer shows:\n';
                comment += '- Every action taken during the test\n';
                comment += '- DOM snapshots at each step\n';
                comment += '- Network requests/responses\n';
                comment += '- Console logs\n';
                comment += '- Screenshots at each step\n\n';
                comment += '</details>\n\n';

                if (report.failed === 0) {
                  comment += '---\n\n';
                  comment += '✨ **All tests passed!** Great work!\n';
                }
              }
            } catch (error) {
              comment += `⚠️ Could not parse test results: ${error.message}\n\n`;
              comment += `Check the [workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
